syntax = "proto3";

package aicoded.runner.v1;

option go_package = "aicoded.dev/framework/runnerproto/runnerv1;runnerv1";

// SecretsService hands out the values of secrets declared in aicoded.yaml.
service SecretsService {
  // GetSecret returns NOT_FOUND for a secret that is not declared.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
}

message GetSecretRequest {
  string name = 1;
}

message GetSecretResponse {
  bytes value = 1;
}
