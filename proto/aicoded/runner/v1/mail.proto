syntax = "proto3";

package aicoded.runner.v1;

option go_package = "aicoded.dev/framework/runnerproto/runnerv1;runnerv1";

// MailService sends the app's mail and serves its mailbox. The sender is always email.from in
// aicoded.yaml; recipients must be in email.to_domains, and Reply-To must be in email.to_domains
// or be email.from. An app without an email section gets FAILED_PRECONDITION; a message the rules
// refuse INVALID_ARGUMENT with a coded message; an unknown message id NOT_FOUND.
service MailService {
  // Send is idempotent per idempotency_key: a repeated key returns the first message's id and
  // sends nothing.
  rpc Send(SendRequest) returns (SendResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
}

message Address {
  string name = 1;
  string address = 2;
}

message Header {
  string name = 1;
  string value = 2;
}

message Attachment {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message SendRequest {
  string idempotency_key = 1;
  string from_name = 2;
  repeated Address to = 3;
  repeated Address cc = 4;
  repeated Address bcc = 5;
  Address reply_to = 6;
  string subject = 7;
  string text = 8;
  string html = 9;
  repeated Attachment attachments = 10;
  repeated Header headers = 11;
}

message SendResponse {
  string id = 1;
}

message MessageSummary {
  string id = 1;
  Address from = 2;
  repeated Address to = 3;
  string subject = 4;
  int64 date_unix = 5;
  int64 size = 6;
  string folder = 7;
}

// ListRequest asks for one page of a folder, newest first. An offset below 0 means 0. A limit of
// 0 or less means 50 and a limit above 100 means 100 (mailrules.DefaultList and MaxList).
message ListRequest {
  string folder = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message ListResponse {
  repeated MessageSummary messages = 1;
  int32 total = 2;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  MessageSummary summary = 1;
  repeated Address cc = 2;
  Address reply_to = 3;
  string text = 4;
  string html = 5;
  repeated Attachment attachments = 6;
  repeated Header headers = 7;
  repeated Address bcc = 8;
}

message DeleteRequest {
  string id = 1;
}

message DeleteResponse {}

message MoveRequest {
  string id = 1;
  string folder = 2;
}

message MoveResponse {}
