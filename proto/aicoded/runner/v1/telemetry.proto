syntax = "proto3";

package aicoded.runner.v1;

option go_package = "aicoded.dev/framework/runnerproto/runnerv1;runnerv1";

// TelemetryService receives the app's spans; the runner exports them.
service TelemetryService {
  rpc Export(ExportRequest) returns (ExportResponse);
}

message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  bytes parent_span_id = 3;
  string name = 4;
  int64 start_unix_nano = 5;
  int64 end_unix_nano = 6;
  map<string, string> attributes = 7;
  string error = 8;
}

message ExportRequest {
  repeated Span spans = 1;
  // Spans the app dropped since the previous export.
  uint64 dropped = 2;
}

message ExportResponse {}
