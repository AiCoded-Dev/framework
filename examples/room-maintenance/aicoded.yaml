app: room-maintenance
class: internal-tool
owner: group:hotel-ops-leads
audience:
  internal: [group:hotel-staff]
size: S
resources: small
ttl: 180d
data:
  - source: sqldb
    classes: [internal]
# access is written by aicoded generate from <ssr:access>; do not edit it
access:
  "/tickets":
    require: ["staff"]
  "/tickets/report":
    require: ["staff"]
  "/tickets/{id}":
    require: ["staff"]
    guard: true
  "/tickets/{id}/edit":
    require: ["staff"]
    guard: true
  "/tickets/{id}/status":
    require: ["staff", "hotel-ops"]
    guard: true
