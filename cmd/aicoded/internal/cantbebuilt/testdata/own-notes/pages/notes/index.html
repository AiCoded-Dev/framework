<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<ssr:access role="staff"/>
<ssr:var name="notes" type="[]Note"/>
<title>My notes</title>
</head>
<body>
<h1>My notes</h1>
<ul id="notes"><li ssr:for="n in notes"><a href="/notes/{{ n.ID }}">{{ n.Title }}</a></li></ul>
<ssr:form name="add">
  <ssr:input name="title" type="text" required maxlength="100"/>
  <ssr:textarea name="body" required maxlength="2000"/>
  <button type="submit">Add</button>
</ssr:form>
</body>
</html>
