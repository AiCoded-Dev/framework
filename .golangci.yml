version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - testifylint
    - unconvert
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]
      # The dev runner and gotool build, test and run the developer's app by design.
      - path: internal/(dev|gotool)/
        text: "G204"
        linters: [gosec]
      # The CLI reads the developer's files by design.
      - path: internal/(devconfig|generate|manifest)/
        text: "G304"
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
